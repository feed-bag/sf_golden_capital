<template>
    <div>
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </template>
        <template if:true={error}>
            <p class="kb-error">Error loading pipeline data.</p>
        </template>
        <template if:true={columns}>
            <div class="kb-toolbar">
                <div class="kb-filter">
                    <label class="kb-filter-label" for="ownerFilter">Owner</label>
                    <select id="ownerFilter" class="kb-filter-select" onchange={handleOwnerFilter}>
                        <template for:each={ownerOptions} for:item="opt">
                            <option key={opt.value} value={opt.value} selected={opt.selected}>{opt.label}</option>
                        </template>
                    </select>
                </div>
                <div class="kb-filter">
                    <button type="button"
                            class={onHoldButtonClass}
                            aria-pressed={onHoldAriaPressed}
                            onclick={handleOnHoldToggle}>
                        On Hold
                    </button>
                </div>
            </div>
            <div class="kb-board">
                <template for:each={columns} for:item="col">
                    <div key={col.stage}
                         class="kb-column"
                         data-stage={col.stage}
                         ondragenter={handleDragEnter}
                         ondragover={handleDragOver}
                         ondragleave={handleDragLeave}
                         ondrop={handleDrop}>
                        <div class="kb-col-header">
                            <div class="kb-col-header-top">
                                <span class="kb-col-title">{col.stage}</span>
                                <span class="kb-col-count">{col.count}</span>
                            </div>
                            <template if:true={col.totalFormatted}>
                                <div class="kb-col-total">{col.totalFormatted}</div>
                            </template>
                        </div>
                        <div class="kb-col-body">
                            <template for:each={col.opportunities} for:item="opp">
                                <div key={opp.Id}
                                     class="kb-card"
                                     draggable="true"
                                     data-id={opp.Id}
                                     ondragstart={handleDragStart}>
                                    <div class="kb-stage-strip" style={opp.stageStripStyle}></div>
                                    <div class="kb-title-row">
                                        <a class="kb-title" href={opp.url} target="_blank">{opp.accountName}</a>
                                        <span class="kb-uid">{opp.uniqueId}</span>
                                    </div>
                                    <template if:true={opp.tags.length}>
                                        <div class="kb-tags">
                                            <template for:each={opp.tags} for:item="tag">
                                                <span key={tag.key} class="kb-tag" style={tag.tagStyle}>{tag.label}</span>
                                            </template>
                                        </div>
                                    </template>
                                    <template if:true={opp.amountFormatted}>
                                        <p class="kb-amount">{opp.amountFormatted}</p>
                                    </template>
                                    <template if:true={opp.badges.length}>
                                        <div class="kb-badges">
                                            <template for:each={opp.badges} for:item="badge">
                                                <span key={badge.key} class={badge.className}>{badge.label}</span>
                                            </template>
                                        </div>
                                    </template>
                                    <div class="kb-footer">
                                        <div class="kb-owner">
                                            <div class="kb-avatar" style={opp.ownerAvatarStyle}>{opp.ownerInitials}</div>
                                            <span class="kb-owner-name">{opp.ownerName}</span>
                                        </div>
                                        <div class="kb-days">
                                            <span class="kb-dot" style={opp.dotStyle}></span>
                                            {opp.daysInStageLabel}
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
            </div>
        </template>
    </div>
</template>
